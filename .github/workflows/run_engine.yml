name: SuperEnalotto V5 Execution & Data Sync

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  run-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurazione Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installazione dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Esecuzione Engine V5 & Ingestion
        run: |
          python superenalotto_v5_final.py

      - name: Verifica file generati
        run: |
          echo "CSV presenti dopo l'esecuzione:"
          find . -type f -name "*.csv" -print

      - name: Commit e Push dei dati aggiornati
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          CSV_FILES=$(find . -type f -name "*.csv" -print)

          if [ -z "$CSV_FILES" ]; then
            echo "Nessun file CSV generato. Nessun aggiornamento da effettuare."
            exit 0
          fi

          echo "File CSV da aggiungere:"
          echo "$CSV_FILES"

          find . -type f -name "*.csv" -print0 | xargs -0 -r git add --

          if git diff --staged --quiet; then
            echo "Nessun aggiornamento nei dati o nei report."
          else
            git commit -m "chore(data): aggiornamento automatico storico e report V5 [skip ci]"
            git push
          fi
